# .github/workflows/papertodo-ios.yml
# PaperTodo iOS 无签名 IPA 构建
name: PaperTodo iOS Build

on:
  push:
    branches: [main, master]
    paths:
      - 'PaperTodo-iOS/**'
      - '.github/workflows/papertodo-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: PaperTodo-iOS
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: PaperTodo-iOS
        run: |
          set +e
          xcodebuild \
            -project PaperTodo.xcodeproj \
            -scheme PaperTodo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          build_status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            echo "::error title=Xcodebuild::$line"
          done < <(grep -E 'error:|fatal error:' xcodebuild.log || true)
          exit "$build_status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PaperTodo-xcodebuild-log
          path: PaperTodo-iOS/xcodebuild.log
          if-no-files-found: warn

      - name: Package IPA
        working-directory: PaperTodo-iOS
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PaperTodo.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PaperTodo-unsigned.ipa Payload
          ls -lh PaperTodo-unsigned.ipa

      - name: Build LiveContainer app
        working-directory: PaperTodo-iOS
        run: |
          set +e
          xcodebuild \
            -project PaperTodo.xcodeproj \
            -scheme PaperTodoLiveContainer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-livecontainer \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-livecontainer.log
          build_status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            echo "::error title=LiveContainer build::$line"
          done < <(grep -E 'error:|fatal error:' xcodebuild-livecontainer.log || true)
          exit "$build_status"

      - name: Package LiveContainer IPA
        working-directory: PaperTodo-iOS
        run: |
          APP_PATH="build-livecontainer/Build/Products/Release-iphoneos/PaperTodoLiveContainer.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PaperTodo-LiveContainer.ipa Payload
          ls -lh PaperTodo-LiveContainer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaperTodo-unsigned-ipa
          path: PaperTodo-iOS/PaperTodo-unsigned.ipa
          if-no-files-found: error

      - name: Upload LiveContainer IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaperTodo-LiveContainer-ipa
          path: PaperTodo-iOS/PaperTodo-LiveContainer.ipa
          if-no-files-found: error

      - name: Upload LiveContainer build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PaperTodo-LiveContainer-xcodebuild-log
          path: PaperTodo-iOS/xcodebuild-livecontainer.log
          if-no-files-found: warn
